# Builds a signed release APK (arm64) and uploads it as a workflow artifact.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    the release keystore, base64-encoded:
#                              [Convert]::ToBase64String([IO.File]::ReadAllBytes("release.jks")) | Set-Clipboard
#   ANDROID_KEYSTORE_PASSWORD  its password (the key's password must be the same)
name: Release APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  NDK_VERSION: "30.0.16248370"
  BUILD_TOOLS_VERSION: "36.0.0"
  PLATFORM: "android-37.0"

jobs:
  apk:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME "cmdline-tools\latest\bin\sdkmanager.bat"
          "y`n" * 20 | & $sdkmanager --install "ndk;$env:NDK_VERSION" "build-tools;$env:BUILD_TOOLS_VERSION" "platforms;$env:PLATFORM" | Out-Null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Install Rust target
        run: rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-linux-android

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE_BASE64) { throw "ANDROID_KEYSTORE_BASE64 secret is not set" }
          $ks = Join-Path $env:RUNNER_TEMP "release.jks"
          [IO.File]::WriteAllBytes($ks, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "CARGO_APK_RELEASE_KEYSTORE=$ks" >> $env:GITHUB_ENV

      - name: Build signed APK
        env:
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./scripts/build-android.ps1 -Release -Ndk (Join-Path $env:ANDROID_HOME "ndk\$env:NDK_VERSION") -Cargo "apk build --lib"

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-mobile-${{ github.ref_name }}-${{ github.run_number }}
          path: target/release/apk/opencode-mobile.apk
          if-no-files-found: error
